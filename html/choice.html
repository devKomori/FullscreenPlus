<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fullscreen display options</title>
    <link rel="stylesheet" href="../css/choice.css">
</head>

<body>
    <main class="choice-backdrop">
        <section class="choice-dialog" role="dialog" aria-modal="true" aria-labelledby="choice-title">
            <h1 id="choice-title">Fullscreen <span>+</span></h1>
            <p>How would you like to display this content?</p>
            <div class="choice-actions">
                <button type="button" data-mode="in-window">In-window</button>
                <button type="button" data-mode="native-fullscreen">Fullscreen</button>
            </div>
        </section>
    </main>
    <script src="../js/choice.js"></script>
</body>

</html>
