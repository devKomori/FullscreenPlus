<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/popup.css">

</head>
<body>

<div class="container">
    <h2>Fullscreen <span class="accent">+</span></h2>
    <p>Fullscreen on <span style="font-style: italic" id="website-name">this website</span> should always:</p>


    <div id="radio-container">
        <label class="radio-label">
            <input type="radio" class="radio-group" name="fullscreen-setting" value="ask">
            Ask
        </label>
        <label class="radio-label">
            <input type="radio" class="radio-group" name="fullscreen-setting" value="in-window">
            In-window
        </label>
        <label class="radio-label">
            <input type="radio" class="radio-group" name="fullscreen-setting" value="native-fullscreen">
            Fullscreen
        </label>
    </div>

    <footer>
        <p>© 2026 Fullscreen+</p>
    </footer>


</div>

<script src="../js/popup.js"></script>
</body>
</html>
